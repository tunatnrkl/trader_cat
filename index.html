:root{--bg:#23202B;--cl:#E8D5A8;--cl2:#DCC594;--wd:#A06A42;--wd2:#6B4128;--wd3:#C48A5E;--pn:#2B3A55;--pnd:#1E2A40;--pnl:#3F5478;--pnh:#6E80A3;--ol:#1A1420;--ac:#F2A33A;--acl:#FFD45E;--acd:#C0712A;--up:#4CD08A;--upd:#2E8F5E;--dn:#E5484D;--dnd:#A83236;--dnl:#FF8A8D;--tx:#F4EBDD;--tx2:#9AA5BD;--c0:#F2A33A;--c1:#5FB3A6;--c2:#6E8FD0;--c3:#C47A5A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--tx);font:400 19px/1.15 "TIDig","Pixelify Sans","TIDig","VT323",monospace;-webkit-font-smoothing:none;font-smooth:never;user-select:none}
canvas,img{image-rendering:pixelated}.ic{vertical-align:middle}
.num{font-family:"TIDig","VT323","TIDig","Pixelify Sans",monospace;font-size:24px;letter-spacing:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%}
/* --- piksel kutu / buton: köşeleri kesik (eksenel gölgelerle) --- */
.pb{background:var(--pn);margin:3px;box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--pnl),inset -3px -3px 0 var(--pnd)}
.pbtn{font:inherit;color:var(--tx);border:0;cursor:pointer;background:var(--pnl);margin:3px;padding:5px 12px;box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--pnh),inset -3px -3px 0 var(--pn);transition:transform 90ms steps(2)}
.pbtn:hover{transform:translateY(-2px)}.pbtn:active{transform:translateY(2px);box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--pn),inset -3px -3px 0 var(--pnh)}
.pbtn.ac{background:var(--ac);color:var(--ol);box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--acl),inset -3px -3px 0 var(--acd)}
.pbtn.on{background:var(--up);color:var(--ol)}
[disabled],[data-dis]{cursor:not-allowed}
.sg{display:flex;gap:3px;height:16px;background:var(--ol);padding:3px}.sg i{flex:1;background:var(--pnd)}.sg i.f{background:var(--ac)}.sg.hp i.f{background:var(--up)}.sg.lo i.f{background:var(--dn)}.sg.mid i.f{background:var(--acl)}
.mx{display:inline-block;background:var(--acl);color:var(--ol);padding:0 6px;font-size:16px;margin-left:6px}
/* --- sütunlar --- */
.col{position:absolute;top:10px;height:880px;display:flex;flex-direction:column;gap:8px}
#left{left:10px;width:340px}#right{left:1250px;width:340px}
#cashp{position:relative;height:100px;background:var(--wd);margin:3px;box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--wd3),inset -3px -3px 0 var(--wd2);padding:8px 10px}
#cashp::before,#cashp::after{content:'';position:absolute;top:6px;width:6px;height:6px;background:var(--wd2)}#cashp::before{left:6px}#cashp::after{right:6px}
#cico{position:absolute;left:14px;top:14px;width:72px;height:72px}
#cashv{position:absolute;left:96px;top:10px;height:40px;display:block}
#cbar{position:absolute;left:96px;right:12px;top:58px}#cnx{position:absolute;left:96px;top:78px;font-size:17px;color:var(--ol)}
#tabs{display:flex;gap:2px;padding:0 4px;height:46px;align-items:flex-end}
.tb{flex:1;font:inherit;font-size:22px;font-weight:700;border:0;cursor:pointer;color:var(--tx);background:var(--pn);margin:3px 3px 0;height:38px;box-shadow:0 -3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--pnl)}
.tb.on{background:var(--pnl);height:46px;margin-top:0;color:var(--acl)}.tb.lk{background:var(--pnd);opacity:.7;cursor:not-allowed}.tb.unl{animation:pop .5s steps(5)}
.sign{margin:3px 6px;height:50px;line-height:50px;text-align:center;background:var(--wd);font-size:28px;font-weight:700;color:var(--acl);text-shadow:2px 2px 0 var(--ol);box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--wd3),inset -3px -3px 0 var(--wd2)}
#sign.c0{border-bottom:0}#list{flex:1;min-height:0;overflow-y:auto;padding:4px 4px 10px;scrollbar-width:thin;scrollbar-color:var(--ac) var(--pnd)}
#list::-webkit-scrollbar{width:12px}#list::-webkit-scrollbar-thumb{background:var(--ac);box-shadow:inset 0 0 0 3px var(--ol)}#list::-webkit-scrollbar-track{background:var(--pnd)}
.tk{position:relative;display:flex;gap:10px;align-items:center;height:92px;margin:6px 10px;padding:8px 10px;background:var(--pn);cursor:pointer;box-shadow:0 -3px 0 var(--ol),0 3px 0 var(--ol),-3px 0 0 var(--ol),3px 0 0 var(--ol),inset 3px 3px 0 var(--pnl),inset -3px -3px 0 var(--pnd);transition:transform 100ms steps(2)}
.tk::before,.tk::after{content:'';position:absolute;top:38px;width:8px;height:14px;background:var(--bg)}.tk::before{left:-3px}.tk::after{right:-3px}
.tk:hover{transform:translateX(4px)}.tk.on{transform:translateX(10px);background:var(--pnl);box-shadow:0 -3px 0 var(--acl),0 3px 0 var(--acl),-3px 0 0 var(--acl),3px 0 0 var(--acl),inset 3px 3px 0 var(--pnh),inset -3px -3px 0 var(--pn)}
.tk .ci{width:72px;height:72px;flex:none}.tk .ptr{position:absolute;left:-34px;top:36px;width:32px;height:32px}
.tn{flex:1;min-width:0}.tn b{display:block;font-size:22px;color:var(--acl);text-shadow:2px 2px 0 var(--ol);white-space:nowrap}.tn .num{display:block;color:var(--tx);text-shadow:2px 2px 0 var(--ol);margin:1px 0 3px}
.tk.boss{background:#3B1A24;box-shadow:0 -3px 0 var(--dn),0 3px 0 var(--dn),-3px 0 0 var(--dn),3px 0 0 var(--dn),inset 3px 3px 0 var(--dnd),inset -3px -3px 0 var(--ol);animation:bossg 1s steps(2) infinite}

 rect(x,y,w,h,m){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,m);return this},
 ell(cx,cy,rx,ry,m){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(x,y,m)}return this},
 tri(x1,y1,x2,y2,x3,y3,m){const mn=Math.min(x1,x2,x3),mx=Math.max(x1,x2,x3),a=Math.min(y1,y2,y3),b=Math.max(y1,y2,y3);

function render(g,sc,opt){opt=opt||{};const c=document.createElement('canvas');c.width=g.w*sc;c.height=g.h*sc;const x=c.getContext('2d');
 const at=(i,j)=>i<0||j<0||i>=g.w||j>=g.h?null:g.a[j][i];
 const same=(m,n)=>n&&(n===m||n[0]==='#'||m[0]==='#');
 (opt.sh||[]).forEach(s=>{x.fillStyle=s.c;for(let j=s.y-s.ry;j<=s.y+s.ry;j++)for(let i=s.x-s.rx;i<=s.x+s.rx;i++){const dx=(i-s.x)/s.rx,dy=(j-s.y)/s.ry;if(dx*dx+dy*dy<=1)x.fillRect(i*sc,j*sc,sc,sc)}});

 for(let j=0;j<g.h;j++)for(let i=0;i<g.w;i++){const m=g.a[j][i];let col=null;
  if(m){if(m[0]==='#')col=m;else{const t=MAT[m],u=at(i,j-1),l=at(i-1,j),d=at(i,j+1),r=at(i+1,j),li=!same(m,u)||!same(m,l),da=!same(m,d)||!same(m,r);col=li&&!da?t[0]:da&&!li?t[2]:t[1]}}

/* v25: robot işlemi OYUNCUYLA BİREBİR AYNI: o anki fiyattan tam 1 coin alır (fiyat nakitten düşülür, nakit yetmezse almaz).
   Satışta değer = alış + kaldıraç × (satış − alış), en az 0; bu değer 0'a inerse likidasyon (oyuncudaki eq/liqd). */
function rOpen(r,rt,t,uo){const u=uo||rPrice(rt,t),st=stakeOf('robot',rt.ci);if(S.cash<st){rt.miss=(rt.miss||0)+1;return}S.cash-=st;rt.tr={b:u,bf:Number(u)/1e4,lv:2**(S.rb[r].v-1),st,t0:t,open:true};rt.tl.push(rt.tr)}

function rSettle(rt,t,liq,uo){const tr=rt.tr;if(!tr)return;const u=uo||(liq?tr.b-tr.b/BigInt(tr.lv):rPrice(rt,t)),R=calculateTradeResult(tr.b,u,tr.lv,tr.st);

const rLiqT=(rt,t0,t1)=>{const tr=rt.tr;if(!tr||tr.lv<=1)return -1;for(let t=t0;t<=t1+1e-9;t+=.02){if(liqd(tr,rPrice(rt,Math.min(t,15))))return Math.min(t,15)}return -1};

function robTick(){if(!S.spc||S.over)return;const now=performance.now();if(PAUSED)return;let ch=0;
 S.rb.forEach((R,r)=>{let rt=RBT[r];if(!rt){if(S.rbOn!==0&&(!RBW[r]||now>=RBW[r])){robStart(r,now);RBW[r]=0}return}   /* v46: kapalıyken yeni tur başlamaz (açık turlar biter) */
  const t=Math.min(15,(now-rt.t0)/1000*rt.sp);
  while(rt.ev.length&&rt.ev[0].t<=t){const e=rt.ev.shift();if(rt.tr){const lt=rLiqT(rt,rt.lt||rt.tr.t0,e.t);if(lt>=0){rSettle(rt,lt,true);ch=1}}rt.lt=e.t;if(e.k==='b'){if(!rt.tr){rOpen(r,rt,e.t);ch=1}}else if(rt.tr){rSettle(rt,e.t);ch=1}}

  if(t>=15){robEnd(r,15);RBW[r]=now+1000/spd();ch=1}});

/* =====================================================================
   v31: SAYI SETİ HER YERDE — metin içinde "$12.5K", "+$1.2M", "4.5e18" gibi para/kısaltmalı sayılar
   otomatik olarak <span class="n"> içine alınır; böylece $ ve K/M/B/T harfleri de rakamlarla aynı pixel sette çizilir.
   (Sayının değeri ve metin içeriği değişmez; yalnızca yazı tipi.)
   ===================================================================== */
const NUMTOK=/[-+−]?\$?%?\d[\d.,]*(?:e\d+|(?:Qa|Qi|Sx|Sp|Oc|No|Dc|[KMBT])(?![A-Za-zÇĞİÖŞÜçğıöşü]))?%?/g;
function numWrapNode(tn){const p=tn.parentNode;if(!p||p.nodeType!==1)return;const tag=p.tagName;if(tag==='SCRIPT'||tag==='STYLE'||tag==='OPTION'||tag==='SELECT'||tag==='TEXTAREA'||p.classList.contains('n'))return;
 const t=tn.nodeValue;if(!t||!/\d/.test(t)||!/[$KMBTeQSOND]/.test(t))return;const fam=getComputedStyle(p).fontFamily||'';if(/^"?TINum/.test(fam.trim()))return;
 let m,last=0,parts=[],hit=false;NUMTOK.lastIndex=0;while((m=NUMTOK.exec(t))){const s=m[0];if(!/[$KMBT]|e\d|Qa|Qi|Sx|Sp|Oc|No|Dc/.test(s)){continue}hit=true;if(m.index>last)parts.push(document.createTextNode(t.slice(last,m.index)));const sp=document.createElement('span');sp.className='n';sp.textContent=s;parts.push(sp);last=m.index+s.length}
 if(!hit)return;if(last<t.length)parts.push(document.createTextNode(t.slice(last)));const f=document.createDocumentFragment();parts.forEach(x=>f.appendChild(x));p.replaceChild(f,tn)}
function numWrapTree(root){if(root.nodeType===3){numWrapNode(root);return}if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const l=[];let n;while((n=w.nextNode()))l.push(n);l.forEach(numWrapNode)}
const NUMOBS=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')numWrapNode(m.target);else m.addedNodes.forEach(numWrapTree)}});
NUMOBS.observe(document.body,{subtree:true,childList:true,characterData:true});numWrapTree(document.body);
